apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: rhbo-demo
  labels:
    app.kubernetes.io/part-of: rhbo-demo
    app.kubernetes.io/component: collector
data:
  config.yaml: |
    ###########################################################################
    # RHBO Collector Config — Sidecar Deployment (filelog + otlpjsonfile)
    ###########################################################################
    receivers:
      filelog:
        include:
          - /var/log/demo/app.log
        start_at: beginning
        operators:
          - type: regex_parser
            regex: '^(?P<timestamp>\S+)\s+(?P<severity>\S+)\s+\[(?P<service>[^\]]+)\]\s+(?P<message>.+)$'
            timestamp:
              parse_from: attributes.timestamp
              layout: '%Y-%m-%dT%H:%M:%SZ'
            severity:
              parse_from: attributes.severity

      otlpjsonfile:
        include:
          - /var/log/demo/otlp-logs.jsonl
        start_at: beginning

    processors:
      resource:
        attributes:
          - key: deployment.environment
            value: staging
            action: upsert
          - key: team.name
            value: platform-engineering
            action: upsert
          - key: rhbo.demo
            value: "true"
            action: insert
          - key: k8s.cluster.name
            value: ocp-demo
            action: upsert

      attributes:
        actions:
          - key: processed_by
            value: rhbo-attributes-processor
            action: upsert
          - key: severity
            action: delete
          - key: timestamp
            action: delete

      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - truncate_all(attributes, 500)
              - set(severity_text, ConvertCase(severity_text, "upper"))
              # ── PII redaction via OTTL (replaces redactionprocessor) ──
              # Credit card numbers
              - replace_pattern(body, "\\b[3-6]\\d{3}[-\\s]?\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}\\b", "****")
              # US Social Security Numbers
              - replace_pattern(body, "\\b\\d{3}-\\d{2}-\\d{4}\\b", "****")
              # Email addresses
              - replace_pattern(body, "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b", "****")
              # API keys (sk- prefix)
              - replace_pattern(body, "\\bsk-[A-Za-z0-9]{10,}\\b", "****")
              # JWT-like tokens
              - replace_pattern(body, "\\beyJ[A-Za-z0-9_-]+\\.[\\w-]+\\b", "****")

      filter:
        error_mode: ignore
        logs:
          log_record:
            - 'severity_number < 9'
            - 'IsMatch(body, "(?i)(health|healthz|ready|readiness|liveness)")'

    exporters:
      debug:
        verbosity: detailed

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        logs/filelog:
          receivers: [filelog]
          processors: [resource, attributes, transform, filter]
          exporters: [debug]
        logs/otlpjson:
          receivers: [otlpjsonfile]
          processors: [resource, attributes, transform, filter]
          exporters: [debug]
