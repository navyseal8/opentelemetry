###############################################################################
# OpenTelemetryCollector CR — Operator-managed approach
#
# Prerequisites:
#   1. Install "Red Hat build of OpenTelemetry" operator from OperatorHub
#   2. Apply this CR after the operator is running
#
# This CR creates a Deployment-mode collector that reads from a shared volume.
# Pair with the log-generator Deployment (04-deployment-demo.yaml) or use
# the standalone log-generator (07-deployment-log-generator-standalone.yaml).
###############################################################################
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: rhbo-demo-collector
  namespace: rhbo-demo
  labels:
    app.kubernetes.io/part-of: rhbo-demo
spec:
  mode: sidecar
  config:
    receivers:
      filelog:
        include:
          - /var/log/demo/app.log
        start_at: beginning
        operators:
          - type: regex_parser
            regex: '^(?P<timestamp>\S+)\s+(?P<severity>\S+)\s+\[(?P<service>[^\]]+)\]\s+(?P<message>.+)$'
            timestamp:
              parse_from: attributes.timestamp
              layout: '%Y-%m-%dT%H:%M:%SZ'
            severity:
              parse_from: attributes.severity

      otlpjsonfile:
        include:
          - /var/log/demo/otlp-logs.jsonl
        start_at: beginning

    processors:
      resource:
        attributes:
          - key: deployment.environment
            value: staging
            action: upsert
          - key: team.name
            value: platform-engineering
            action: upsert
          - key: rhbo.demo
            value: "true"
            action: insert
          - key: k8s.cluster.name
            value: ocp-demo
            action: upsert

      attributes:
        actions:
          - key: processed_by
            value: rhbo-attributes-processor
            action: upsert
          - key: severity
            action: delete
          - key: timestamp
            action: delete

      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - truncate_all(attributes, 500)
              - set(severity_text, ConvertCase(severity_text, "upper"))
              # ── PII redaction via OTTL ──
              - replace_pattern(body, "\\b[3-6]\\d{3}[-\\s]?\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}\\b", "****")
              - replace_pattern(body, "\\b\\d{3}-\\d{2}-\\d{4}\\b", "****")
              - replace_pattern(body, "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b", "****")
              - replace_pattern(body, "\\bsk-[A-Za-z0-9]{10,}\\b", "****")
              - replace_pattern(body, "\\beyJ[A-Za-z0-9_-]+\\.[\\w-]+\\b", "****")

      filter:
        error_mode: ignore
        logs:
          log_record:
            - 'severity_number < 9'
            - 'IsMatch(body, "(?i)(health|healthz|ready|readiness|liveness)")'

    exporters:
      debug:
        verbosity: detailed

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        logs/filelog:
          receivers: [filelog]
          processors: [resource, attributes, transform, filter]
          exporters: [debug]
        logs/otlpjson:
          receivers: [otlpjsonfile]
          processors: [resource, attributes, transform, filter]
          exporters: [debug]

  volumeMounts:
    - name: shared-logs
      mountPath: /var/log/demo
      readOnly: true
  volumes:
    - name: shared-logs
      emptyDir: {}
