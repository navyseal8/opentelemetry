###############################################################################
# 22-tempo-rbac.yaml
# RBAC for the RHBO collector to write traces to multi-tenant Tempo,
# and for OpenShift Console users to read traces.
#
# Creates:
#   1. ServiceAccount for the collector gateway
#   2. ClusterRole for writing trace data (rhbo-demo tenant)
#   3. ClusterRoleBinding granting the SA write access
#   4. ClusterRole for reading trace data (for Console users)
#   5. ClusterRoleBinding granting authenticated users read access
###############################################################################

# ── 1. ServiceAccount for the collector ─────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhbo-collector-gateway
  namespace: rhbo-demo
  labels:
    app: rhbo-collector-gateway
    app.kubernetes.io/part-of: rhbo-demo

---
# ── 2. ClusterRole: write traces for rhbo-demo tenant ──────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhbo-tempo-traces-write
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - rhbo-demo
    resourceNames:
      - traces
    verbs:
      - create

---
# ── 3. ClusterRoleBinding: collector SA → write role ────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhbo-collector-traces-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhbo-tempo-traces-write
subjects:
  - kind: ServiceAccount
    name: rhbo-collector-gateway
    namespace: rhbo-demo

---
# ── 4. ClusterRole: read traces for rhbo-demo tenant ───────────────────────
# Grants access to the Jaeger UI and COO Tracing UI in the Console.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhbo-tempo-traces-read
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - rhbo-demo
    resourceNames:
      - traces
    verbs:
      - get

---
# ── 5. ClusterRoleBinding: all authenticated users → read role ──────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhbo-tempo-traces-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhbo-tempo-traces-read
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
