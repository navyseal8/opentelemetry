# =============================================================================
# 11-minio.yaml
# Deploys MinIO as an S3-compatible object store in the openshift-logging
# namespace.  Both LokiStack (logs) and TempoMonolithic (traces) point to
# this single MinIO instance.
#
# ⚠️  FOR DEMO / DEV PURPOSES ONLY – data is stored in an emptyDir volume
#     and will be lost when the pod is rescheduled.  For production, use a
#     PersistentVolumeClaim or a managed object storage service (e.g. AWS S3,
#     Azure Blob, GCS).
# =============================================================================

---
# ---- MinIO Deployment -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: openshift-logging
  labels:
    app: minio
    app.kubernetes.io/part-of: rhbo-demo
    app.kubernetes.io/component: object-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: minio
            - name: MINIO_ROOT_PASSWORD
              value: minio123
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          # Ephemeral storage — data does NOT survive pod restarts
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}

---
# ---- MinIO Service ----------------------------------------------------------
# Exposes both the S3-compatible API (9000) and the web console (9001).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: openshift-logging
  labels:
    app: minio
    app.kubernetes.io/part-of: rhbo-demo
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP

---
# ---- Bucket bootstrap Job ---------------------------------------------------
# Uses the MinIO Client (mc) to create the buckets required by Loki and Tempo.
# --ignore-existing makes the job idempotent (safe to re-run).
# restartPolicy: OnFailure will retry if MinIO is not yet ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-setup
  namespace: openshift-logging
  labels:
    app: minio-bucket-setup
    app.kubernetes.io/part-of: rhbo-demo
    app.kubernetes.io/component: object-storage
spec:
  backoffLimit: 10          # allow retries while MinIO starts up
  template:
    metadata:
      labels:
        app: minio-bucket-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              # Wait briefly for MinIO to become reachable
              echo "Waiting for MinIO to be ready..."
              until mc alias set local http://minio.openshift-logging.svc:9000 minio minio123; do
                echo "MinIO not ready yet – retrying in 5s..."
                sleep 5
              done

              echo "Creating buckets..."
              mc mb --ignore-existing local/loki-data
              mc mb --ignore-existing local/tempo-data
              echo "Bucket setup complete."

---
# =============================================================================
# S3 Secrets
# Each backend (Loki, Tempo) needs its own Secret referencing MinIO.
# =============================================================================

---
# ---- Secret for LokiStack (openshift-logging namespace) --------------------
apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-s3
  namespace: openshift-logging
  labels:
    app.kubernetes.io/part-of: rhbo-demo
    app.kubernetes.io/component: loki-storage
type: Opaque
stringData:
  endpoint: http://minio.openshift-logging.svc:9000
  bucketnames: loki-data
  access_key_id: minio
  access_key_secret: minio123
  # MinIO defaults to us-east-1 when no region is configured
  region: us-east-1

---
# ---- Secret for TempoMonolithic (rhbo-demo namespace) ----------------------
apiVersion: v1
kind: Secret
metadata:
  name: tempo-s3
  namespace: rhbo-demo
  labels:
    app.kubernetes.io/part-of: rhbo-demo
    app.kubernetes.io/component: tempo-storage
type: Opaque
stringData:
  endpoint: http://minio.openshift-logging.svc:9000
  bucket: tempo-data
  access_key_id: minio
  access_key_secret: minio123
