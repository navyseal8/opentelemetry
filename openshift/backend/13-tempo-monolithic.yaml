###############################################################################
# 13-tempo-monolithic.yaml
# Deploys a TempoMonolithic instance with OpenShift multitenancy.
#
# Multitenancy enables:
#   - Authentication via OpenShift OAuth / TokenReview
#   - Authorization via SubjectAccessReview (RBAC)
#   - Tenant-scoped trace isolation
#
# The gateway is automatically enabled when multitenancy is configured.
# Clients must send:
#   - Bearer token (ServiceAccount token) for authentication
#   - X-Scope-OrgID header for tenant routing
#
# For production, use TempoStack instead for horizontal scaling.
###############################################################################
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoMonolithic
metadata:
  name: rhbo-tempo
  namespace: rhbo-demo
  labels:
    app.kubernetes.io/part-of: rhbo-demo
    app.kubernetes.io/component: trace-storage
spec:
  storage:
    traces:
      backend: s3
      size: 1Gi
      s3:
        secret: tempo-s3

  jaegerui:
    enabled: true
    route:
      enabled: true

  multitenancy:
    enabled: true
    mode: openshift
    authentication:
      - tenantName: rhbo-demo
        tenantId: "1610b0c3-c509-4592-a256-a1871353dbfa"
