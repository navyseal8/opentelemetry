###############################################################################
# 03-coo-operator.yaml
#
# Installs the Cluster Observability Operator (COO).
#
# As of COO 1.1+, the recommended namespace is
# openshift-cluster-observability-operator (not openshift-operators).
#
# This manifest creates:
#   1. Namespace openshift-cluster-observability-operator
#   2. OperatorGroup in that namespace
#   3. Subscription to the stable channel from redhat-operators
#
# Apply with:
#   oc apply -f 03-coo-operator.yaml
###############################################################################

apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cluster-observability-operator
  labels:
    openshift.io/cluster-monitoring: "true"

---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  upgradeStrategy: Default

---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
