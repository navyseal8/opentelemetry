# 00-rhbo-operator.yaml
#
# Installs the Red Hat Build of OpenTelemetry (RHBO) operator.
#
# This manifest creates:
#   1. A dedicated Project (namespace) for the operator: openshift-opentelemetry-operator
#      - Labeled with openshift.io/cluster-monitoring: "true" to enable cluster monitoring.
#   2. An OperatorGroup scoped to the namespace.
#   3. A Subscription to install the operator from the redhat-operators catalog.
#
# Apply with:
#   oc apply -f 00-rhbo-operator.yaml
---
apiVersion: project.openshift.io/v1
kind: Project
metadata:
  name: openshift-opentelemetry-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-opentelemetry-operator
  namespace: openshift-opentelemetry-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: openshift-opentelemetry-operator
spec:
  channel: stable
  name: opentelemetry-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
