apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-log-data
  namespace: rhbo-demo
  labels:
    app.kubernetes.io/part-of: rhbo-demo
    app.kubernetes.io/component: log-generator
data:
  app.log: |
    2026-09-05T10:00:01Z INFO  [order-service] Order #12345 placed by user john.doe@example.com, credit card 4111-1111-1111-1111, amount $299.99
    2026-09-05T10:00:02Z DEBUG [order-service] Health check passed, uptime=3600s
    2026-09-05T10:00:03Z WARN  [order-service] Slow query detected: SELECT * FROM orders WHERE user_ssn='123-45-6789' took 2.3s
    2026-09-05T10:00:04Z INFO  [payment-service] Payment processed for order #12345, card=4222-2222-2222-2222, email=jane.smith@corp.com
    2026-09-05T10:00:05Z DEBUG [order-service] GET /healthz returned 200
    2026-09-05T10:00:06Z ERROR [inventory-service] Failed to update stock for SKU-9876: connection timeout, retry_count=3
    2026-09-05T10:00:07Z INFO  [user-service] User registration: name=Alice Johnson, phone=+1-555-867-5309, ssn=987-65-4321
    2026-09-05T10:00:08Z DEBUG [order-service] Health check passed, uptime=3607s
    2026-09-05T10:00:09Z INFO  [shipping-service] Shipment created for order #12345, destination=123 Main St, tracking=TRACK-ABC-789
    2026-09-05T10:00:10Z WARN  [payment-service] Rate limit approaching: 450/500 requests, api_key=sk-prod-abc123xyz789
  otlp-logs.jsonl: |
    {"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"frontend-app"}}]},"scopeLogs":[{"scope":{"name":"login-handler"},"logRecords":[{"timeUnixNano":"1725526800000000000","severityNumber":9,"severityText":"INFO","body":{"stringValue":"User login successful: user=bob@company.com, ip=192.168.1.100, session_token=eyJhbGciOiJIUzI1NiJ9.secret"},"attributes":[{"key":"user.email","value":{"stringValue":"bob@company.com"}},{"key":"auth.method","value":{"stringValue":"password"}}]}]}]}]}
    {"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"frontend-app"}}]},"scopeLogs":[{"scope":{"name":"checkout-handler"},"logRecords":[{"timeUnixNano":"1725526801000000000","severityNumber":9,"severityText":"INFO","body":{"stringValue":"Checkout completed: order_id=ORD-5678, card_number=5500-0000-0000-0004, cvv=123, total=149.99"},"attributes":[{"key":"order.id","value":{"stringValue":"ORD-5678"}},{"key":"payment.card_last4","value":{"stringValue":"0004"}}]}]}]}]}
    {"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"frontend-app"}}]},"scopeLogs":[{"scope":{"name":"api-gateway"},"logRecords":[{"timeUnixNano":"1725526802000000000","severityNumber":5,"severityText":"DEBUG","body":{"stringValue":"Health probe: GET /ready returned 200 OK"},"attributes":[{"key":"http.method","value":{"stringValue":"GET"}},{"key":"http.route","value":{"stringValue":"/ready"}}]}]}]}]}
    {"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"frontend-app"}}]},"scopeLogs":[{"scope":{"name":"profile-handler"},"logRecords":[{"timeUnixNano":"1725526803000000000","severityNumber":13,"severityText":"WARN","body":{"stringValue":"Profile update failed: user_id=USR-999, ssn_on_file=111-22-3333, error=validation_failed"},"attributes":[{"key":"user.id","value":{"stringValue":"USR-999"}},{"key":"error.type","value":{"stringValue":"validation"}}]}]}]}]}
